services:
  web:
    container_name: web
    build:
      dockerfile: ./docker/nginx/Dockerfile
    ports:
      - '8080:80'
      - '8443:443'
    volumes:
      - .:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/default-ssl.conf:/etc/nginx/conf.d/default-ssl.conf
    links:
      - php-fpm

  php-fpm:
    container_name: php-fpm
    build:
      dockerfile: ./docker/php-fpm/Dockerfile
    volumes:
      - .:/app
    links:
      - composer

  php-cli:
    container_name: php-cli
    build:
      dockerfile: ./docker/php-cli/Dockerfile
    volumes:
      - .:/app
    environment:
      - XDEBUG_MODE=coverage
    links:
      - composer

  composer:
    container_name: composer
    image: composer
    volumes:
      - .:/app
    entrypoint:
      - composer
      - install
